name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra taxonomy --extra feeds --extra youtube-transcripts

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Test
        run: uv run pytest
      - name: Package build and install smoke test
        env:
          RUMEN_DB_DSN: "sqlite:///${{ runner.temp }}/rumen-package-smoke.db"
        run: |
          uv build --out-dir dist
          uvx --python 3.11 --isolated --refresh-package rumen --from dist/*.whl rumen --help
